[project]
name = "lean-agent"
version = "0.0.1"
description = "Lean proving environment with subagent-based decomposition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "verifiers==0.1.8.post1",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lean_agent"]

[tool.verifiers.eval]
num_examples = 6
rollouts_per_example = 1
